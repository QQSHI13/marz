name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo fmt --all -- --check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - run: uv tool install maturin
      # Build the extension into a venv and run the binding tests against it.
      # Building the wheel alone would not catch a method that fails to convert
      # a Python value, since none of that runs until something calls it.
      - name: Test bindings
        working-directory: python
        run: |
          uv venv
          uv pip install pytest
          uv run maturin develop --uv
          uv run pytest -q

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            cargo install wasm-pack --locked
          fi
      - run: wasm-pack build crates/marz-wasm --out-dir ../../js/pkg --target web --profile wasm-release
