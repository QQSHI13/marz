name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      # --all-targets so examples and tests are linted too: the fixture
      # generator is an example, and would otherwise never be checked.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No Cargo.lock is committed (library crate, see .gitignore), so checking
      # against latest deps proves nothing about the declared MSRV: a new dep
      # could require a newer rustc and fail here for the wrong reason — or
      # pass by accident. Resolve minimum versions first (nightly-only flag),
      # then check those exact versions on 1.78. Lib only: dev-dependencies
      # are resolved but not built, so contributor tooling may float.
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo update -Z minimal-versions
      - uses: dtolnay/rust-toolchain@1.78
      # --locked pins the minimal versions resolved above; network stays on
      # so cargo can fill its cache (an --offline flag fails here when the
      # .crate files were never downloaded).
      - run: cargo check -p marz-core --lib --locked

  # The committed fixture must be what the generator produces. Without this the
  # two can drift: someone edits an expectation by hand to make a test pass, and
  # the fixture stops being an oracle and becomes a record of the bug.
  golden-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Regenerate from lunr.js
        working-directory: tests
        run: |
          npm ci
          node generate_golden.js
      - name: Fail if the fixture is not what lunr.js produces
        run: git diff --exit-code -- tests/fixtures/

  js-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate JS fixtures
        run: |
          cargo run --example mkfixture -p marz-core -- \
            js/fixtures/corpus_en.json js/fixtures/en.marz en
          cargo run --example mkfixture -p marz-core -- \
            js/fixtures/corpus_ja.json js/fixtures/ja.marz ja
      - name: Fail if JS fixtures drifted
        run: git diff --exit-code -- js/fixtures/

  stemmers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Regenerate stemmers from the pinned Snowball ref
        run: bash scripts/vendor-stemmers.sh
      # The generator emits unformatted code; committed files are formatted.
      - name: Format generated code
        run: cargo fmt --all
      - name: Fail if generated code drifted from its source
        run: git diff --exit-code -- crates/marz-core/src/stemmers/ SNOWBALL_REF

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - run: uv tool install maturin
      # Build the extension into a venv and run the binding tests against it.
      # Building the wheel alone would not catch a method that fails to convert
      # a Python value, since none of that runs until something calls it.
      - name: Test bindings
        working-directory: python
        run: |
          uv venv
          uv pip install pytest
          uv run maturin develop --uv
          uv run pytest -q

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Node's built-in test runner strips the TypeScript at runtime, so the JS
      # suite needs no npm install. 22.x is the oldest release that does it.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            cargo install wasm-pack --locked
          fi
      - name: Install wasm-opt (binaryen)
        run: |
          if ! command -v wasm-opt &> /dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q binaryen
          fi
          wasm-opt --version
      - run: scripts/build-wasm.sh

      # The optional client-side builder is compiled only under its feature, so
      # nothing above type-checks it. Lint it on the real target: this code only
      # ever runs on wasm32, and `js_sys` behaves differently elsewhere.
      - name: Lint the builder feature
        run: cargo clippy -p marz-wasm --target wasm32-unknown-unknown --features builder -- -D warnings

      - name: Build the builder feature (it must compile, not just lint)
        run: cargo check -p marz-wasm --target wasm32-unknown-unknown --features builder

      # Exercises the boundary the Rust suite cannot: that tuples arrive as
      # [start, length] arrays, that failures arrive as real Error objects, and
      # that highlight offsets survive astral-plane characters.
      - name: Test the JS bindings
        working-directory: js
        run: node --test 'test/*.test.ts'

      - name: Typecheck JS wrapper and tests
        working-directory: js
        run: |
          npm install
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit --types node --module nodenext --target es2022 --moduleResolution bundler --strict test/index.test.ts || echo "test typecheck is advisory; see js/tsconfig.json"

      # A published tarball must contain the engine. `files` in package.json is
      # not enough on its own: wasm-pack writes a `.gitignore` containing `*`
      # into its output directory, npm reads a nested `.gitignore` as an
      # `.npmignore`, and the result packs the TypeScript wrapper with no
      # WebAssembly beside it — installable, importable, and broken on first
      # search. scripts/build-wasm.sh removes that file; this proves it.
      - name: Check the publishable tarball contains the engine
        working-directory: js
        run: |
          npm install
          npm run build:ts
          npm pack --dry-run --json > pack.json
          node -e '
            // npm 12 keys this object by package name; older npm returned an
            // array. Take the values either way rather than depending on which.
            const report = JSON.parse(require("fs").readFileSync("pack.json"));
            const entry = Object.values(report)[0];
            const files = entry.files.map((f) => f.path);
            const required = [
              "pkg/marz_wasm_bg.wasm",
              "pkg/marz_wasm.js",
              "dist/index.js",
            ];
            const missing = required.filter((f) => !files.includes(f));
            if (missing.length) {
              console.error("npm pack omits: " + missing.join(", "));
              console.error("packed: " + files.join(", "));
              process.exit(1);
            }
            console.log("tarball contains the engine: " + files.length + " files");
          '

      # The number a page actually pays. wasm-bindgen's gc pass strips most of
      # `cargo build`'s artifact, so this is measured after the full pipeline.
      #
      # The ceiling is asserted, not just reported. The README quotes this number
      # as a headline feature, and a silently unoptimized build — which is what a
      # wasm-opt failure produces, since wasm-pack ships the module anyway — costs
      # 16 KB while looking like a green build. The limit is deliberately loose:
      # it should catch that class of accident, not force a bump for every honest
      # kilobyte. Raise it and update the README together.
      #
      # 37 Snowball stemmers are the bulk of this: measured, 85,684 gzipped with
      # none and 194,556 with all of them, ~2.9 KB apiece.
      - name: Report shipped size
        run: |
          raw=$(stat -c %s js/pkg/marz_wasm_bg.wasm)
          gz=$(gzip -9 -c js/pkg/marz_wasm_bg.wasm | wc -c)
          echo "wasm: $raw bytes raw, $gz bytes gzipped" >> "$GITHUB_STEP_SUMMARY"
          # 576,895 raw as of Sep 2026: four rounds of query-time machinery
          # (fold-union scoring, escape parity, multi-language plumbing) on top
          # of toolchain drift and 37 stemmers. Honest weight, not an accident:
          # ~4% headroom still catches a silently unoptimized build, which
          # costs tens of KB at this size. Raise it and update the README
          # together.
          limit=600000
          if [ "$raw" -gt "$limit" ]; then
            echo "::error::wasm is $raw bytes, over the $limit byte limit." \
                 "If wasm-opt failed above, that is the cause." >&2
            exit 1
          fi

      # The feature gates are the only lever on size, and they fail *silently*:
      # `default-features = false` on a dependent is ignored unless the
      # `[workspace.dependencies]` entry declares it too, so a single-language
      # build can quietly link all 37 stemmers and still pass every other check.
      # That is exactly what happened while this was being written. Asserting the
      # trimmed build is much smaller than the full one is what keeps the lever
      # connected — a regression here means everyone shipping one language pays
      # for thirty-seven.
      - name: Check a single-language build still trims
        run: |
          scripts/build-wasm.sh --no-default-features --features de
          raw=$(stat -c %s js/pkg/marz_wasm_bg.wasm)
          gz=$(gzip -9 -c js/pkg/marz_wasm_bg.wasm | wc -c)
          echo "wasm (de only): $raw bytes raw, $gz bytes gzipped" \
            >> "$GITHUB_STEP_SUMMARY"
          # 224,029 raw as of Sep 2026 (full build: 550,449): the lever this
          # guards — one stemmer linked instead of 37 — is working, the floor
          # moved with the toolchain. Still far below the full build, which is
          # the property that matters; a disconnected lever would read ~550KB.
          limit=250000
          if [ "$raw" -gt "$limit" ]; then
            echo "::error::a German-only build is $raw bytes, over $limit." \
                 "The per-language features are not trimming — check that" \
                 "[workspace.dependencies] marz-core still has" \
                 "default-features = false." >&2
            exit 1
          fi
