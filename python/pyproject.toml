[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "marz"
version = "0.1.0"
description = "Offline search engine with first-class CJK support and no segmentation dictionary."
# Symlinks to the repository root. Packaging metadata cannot reference paths
# outside the project directory (`../README.md` is rejected outright), and
# duplicating a 202-line licence into a subdirectory invites the two copies to
# drift. Git tracks symlinks, so a fresh clone builds.
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "marz._marz"
python-source = "."
include = ["marz/py.typed", "marz/_marz.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
