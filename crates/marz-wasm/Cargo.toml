[package]
name = "marz-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings for Marz search."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Client-side index building. Adds 39 KB of WebAssembly for tokenization,
# scoring and serialization, which a search-only bundle never runs. See
# `src/builder.rs` for when it earns that.
builder = []

[dependencies]
marz-core = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
