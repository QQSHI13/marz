[package]
name = "marz-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core search engine for Marz, a lunr-compatible offline search library."
# Symlinks to the repository root, for the same reason python/ has them: cargo
# packages only what lives inside the crate directory, so `../../LICENSE` is not
# included and a published crate would carry neither its licence nor its README.
# Git tracks symlinks and cargo follows them when packaging.
readme = "README.md"
# Keeps the benches, examples and the 1.4 MB of test fixtures out of the
# published tarball. They are needed to develop the crate, not to depend on it,
# and `cargo publish` verifies the package by building it — with `tests`
# included it would also need the fixtures to be present and correct.
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

# One feature per Snowball-stemmed language, because trimming which stemmers
# ship is the only lever that moves the WebAssembly size. Measured through
# `scripts/build-wasm.sh`: the vendored runtime is ~0.2 KB and each stemmer is
# ~2.9 KB gzipped, so the cost is linear in language count and nothing else
# about the build changes it.
#
# All 37 are on by default. A search engine that silently lacks German is worse
# than one that is 100 KB larger, and native callers — every Python user — have
# no size constraint at all. Anyone building their own browser bundle for a
# single-language site can get back to ~87 KB gzipped:
#
#   wasm-pack build crates/marz-wasm --no-default-features --features marz-core/de
#
# Turning a language off removes its stemmer, not the language: the code still
# resolves and still tokenizes, it just stops stemming. `en`, `zh`, `ja`, `ko`
# and the five non-spacing scripts are hand-written rather than generated, so
# they are always present and have no feature to disable.
[features]
default = ["all-languages"]

all-languages = [
    "ar", "ca", "cs", "da", "de", "el", "eo", "es", "et", "eu", "fa", "fi",
    "fr", "ga", "hi", "hu", "hy", "id", "it", "lt", "ne", "nl", "no", "pl",
    "pt", "ro", "ru", "sr", "st", "sv", "ta", "tr", "yi",
    "en-snowball", "en-porter", "en-lovins", "nl-porter",
]

ar = []
ca = []
cs = []
da = []
de = []
el = []
eo = []
es = []
et = []
eu = []
fa = []
fi = []
fr = []
ga = []
hi = []
hu = []
hy = []
id = []
it = []
lt = []
ne = []
nl = []
no = []
pl = []
pt = []
ro = []
ru = []
sr = []
st = []
sv = []
ta = []
tr = []
yi = []

# Variant algorithms rather than languages. See `SNOWBALL_LANGUAGES`.
"en-snowball" = []
"en-porter" = []
"en-lovins" = []
"nl-porter" = []

# marz-core itself has no dependencies. The binary format, the tokenizers,
# the stemmers and the query parser are all hand-written.
[dependencies]

[dev-dependencies]
criterion = "0.8"
# JSON parsing for test fixtures and example CLIs (cjk.json, the lunr.js
# oracle, corpus files). Unrelated to any index format.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Criterion supplies its own `main`. Without this the libtest harness is linked
# in too and consumes the command line first, so `--save-baseline`,
# `--measurement-time` and every other criterion flag is rejected as an unknown
# test option — the benches run, but only ever with default settings.
[[bench]]
name = "search"
harness = false
